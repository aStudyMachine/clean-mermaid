name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 要发布的版本号，必须与 manifest.json / package.json / versions.json 一致
        required: true
        type: string
      notes:
        description: Release 说明（可留空，之后在 GitHub 上补写双语版本）
        required: false
        type: string
        default: ""
      publish:
        description: 勾选才真正创建 Release；不勾选则只构建并打印产物哈希
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # 创建 Release 要写 contents，签名要 id-token 与 attestations。
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # 复审判为 Error 级会把我方发布标成 Failed，插件因此在社区目录搜不到，且只有发新版本
      # 才能恢复（同版本号重发不重算结论）。这三条对齐已知的 Error 级规则，让同类问题在
      # 创建 Release 之前就红，而不是等社区扫出来。
      - name: 代码侧守卫（对齐复审规则）
        run: |
          problems=0

          static_style=$(grep -rnE '\.style\.[a-zA-Z]+ = "[^$]' src/ || true)
          if [ -n "$static_style" ]; then
            echo "::error::静态字面量 style 赋值（obsidianmd/no-static-styles-assign 判 Error 级）—— 改用 CSS 类或 setCssStyles"
            printf '%s\n' "$static_style"
            problems=1
          fi

          # 摘不掉的 !important 只有两处（对抗官方可能带内联样式的输出，见 styles.css 注释与 TODO）。
          important=$(grep -cE '^[[:space:]]*[a-z-]+[[:space:]]*:.*!important' styles.css || true)
          if [ "${important:-0}" -gt 2 ]; then
            echo "::error::styles.css 的 !important 声明为 ${important} 处，超过已核准的 2 处"
            grep -nE '^[[:space:]]*[a-z-]+[[:space:]]*:.*!important' styles.css || true
            problems=1
          fi

          raw_create=$(grep -rn 'document\.createElement' src/ || true)
          if [ -n "$raw_create" ]; then
            echo "::error::document.createElement（obsidianmd/prefer-create-el）—— 改用 Obsidian 的 createEl / createDiv"
            printf '%s\n' "$raw_create"
            problems=1
          fi

          if [ "$problems" -ne 0 ]; then
            echo "本仓库无 Obsidian 官方 linter，以上是把已知规则抄成本地守卫的兜底；发版前仍应先用社区目录的 branch 预览扫描（见 AGENTS.md）。" >&2
            exit 1
          fi
          echo "代码侧守卫通过"

      - name: 校验版本三处一致
        env:
          WANT: ${{ inputs.version }}
        run: |
          node -e '
            const fs = require("node:fs");
            const want = process.env.WANT;
            const read = (f) => JSON.parse(fs.readFileSync(f, "utf8"));
            const manifest = read("manifest.json");
            const pkg = read("package.json");
            const versions = read("versions.json");
            const problems = [];
            if (manifest.version !== want) {
              problems.push(`manifest.json 是 ${manifest.version}，要发的是 ${want}`);
            }
            if (pkg.version !== want) {
              problems.push(`package.json 是 ${pkg.version}`);
            }
            if (!versions[want]) {
              problems.push(`versions.json 里没有 ${want} 的最低版本映射`);
            }
            if (problems.length) {
              console.error(problems.join("\n"));
              process.exit(1);
            }
          '

      - name: 产物哈希
        run: sha256sum main.js manifest.json styles.css

      - name: 发布前检查分支
        if: ${{ inputs.publish }}
        env:
          REF: ${{ github.ref_name }}
        run: |
          if [ "$REF" != "main" ]; then
            echo "只能从 main 发布，当前是 ${REF} —— 社区目录读的是默认分支 HEAD。" >&2
            exit 1
          fi

      - name: 创建 Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release create "$VERSION" main.js manifest.json styles.css \
            --title "Clean Mermaid $VERSION" \
            --notes "${NOTES:-See CHANGELOG.md}"

      - name: 签 artifact attestation
        if: ${{ inputs.publish }}
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ github.workspace }}/main.js
            ${{ github.workspace }}/styles.css
